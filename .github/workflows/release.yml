name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 升级到 node24 运行时版本，消除 Node.js 20 弃用告警
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test wheel preview scheduling
        run: node --test tests/wheel-preview.test.mjs

      - name: Build
        run: .\wordy.ps1 build -Clean -NoPause

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Wordy.exe
          generate_release_notes: true
