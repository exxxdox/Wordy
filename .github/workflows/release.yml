name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 升级到 node24 运行时版本，消除 Node.js 20 弃用告警
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: .\wordy.ps1 build -Clean -NoPause

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Wordy.exe
          generate_release_notes: true
